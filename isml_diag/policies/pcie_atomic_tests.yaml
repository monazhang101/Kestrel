module: pcie

tests:
  pcie_dma_data_transfer:
    summary: Run PCIe DMA data movement and compare payload.
    args:
      direction:
        type: string
        default: h2d
        range: h2d, d2h
      size_bytes:
        type: u64
        default: 4096
        # 128 MiB: mirrors ISML_DIAG_HOST_DMA_MAX_SIZE_BYTES in the kernel UAPI.
        range: 32-134217728
        unit: bytes
      pattern:
        type: string
        default: incremental
        range: zero, incremental, random
      device_offset:
        type: u64
        default: 0x10200
        unit: bytes
      timeout_ms:
        type: u64
        default: 1000
        unit: ms

  sequential_aperture_mapping:
    summary: Configure BAR23/BAR45 apertures sequentially and verify each mapped window.
    args: {}
