testcases:
  dma_data_transfer:
    arguments:
      direction:
        range: [h2d, d2h, d2i2d, d2s2d, d2v2d]
      size_bytes:
        range: [32, 134217728]
      pattern:
        range: [zero, incremental, random]
      device_offset:
        range: [0, 268435455]
      return_offset:
        range: [0, 268435455]
      intermediate_offset:
        # Direction-dependent bring-up bounds are checked by the testcase.
        range: [0, 255]
      timeout_ms:
        range: [1, 60000]
